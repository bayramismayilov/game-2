<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star Collector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hud">
    <div class="hud-left">
      <h1>Star Collector</h1>
      <p>Move with WASD or arrow keys. Collect 10 stars. Avoid rocks.</p>
    </div>
    <div class="hud-right">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
      <div>Time: <span id="time">0.0</span>s</div>
    </div>
  </header>

  <main class="game-shell">
    <canvas id="game" width="900" height="560"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-panel">
        <h2 id="overlay-title">You win!</h2>
        <p id="overlay-message">Great job!</p>
        <button id="restart">Play Again</button>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
