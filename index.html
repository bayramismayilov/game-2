<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FatEmil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hud">
    <div class="hud-left">
      <h1>FatEmil</h1>
      <p>Move with WASD or arrow keys. Collect healthy food for points and avoid junk food.</p>
      <p class="hud-note">Sound starts on your first key press or click.</p>
    </div>
    <div class="hud-right">
      <div>Score: <span id="score">0</span></div>
      <div>Round: <span id="round">1 / 3</span></div>
      <div>Target: <span id="target">0</span></div>
      <div>Time Left: <span id="time">60.0</span>s</div>
      <div>Lives: <span id="lives">3</span></div>
    </div>
  </header>

  <main class="game-shell">
    <canvas id="game" width="900" height="560"></canvas>
    <div id="overlay" class="overlay hidden">
      <div class="overlay-panel">
        <h2 id="overlay-title">You win!</h2>
        <p id="overlay-message">Great job!</p>
        <button id="restart">Play Again</button>
      </div>
    </div>
  </main>

  <audio id="bgm" src="assets/your-idol.mp3" preload="auto"></audio>

  <script src="main.js"></script>
</body>
</html>
